<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FXerkan · contribution styles</title>
<style>
  :root { --bg:#03040a; --fg:#c9d1d9; --dim:#6e7681; --accent:#00d9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { position:sticky; top:0; z-index:5; backdrop-filter:blur(8px);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom:1px solid #1b2230; padding:16px 20px; }
  .wrap { max-width:912px; margin:0 auto; }
  h1 { font-size:16px; margin:0 0 2px; letter-spacing:1px; }
  h1 .cy { color:var(--accent); }
  .sub { color:var(--dim); font-size:12px; margin:0 0 12px; }
  .themes { display:flex; gap:8px; flex-wrap:wrap; }
  button.theme { cursor:pointer; font:inherit; font-size:12px; letter-spacing:1px;
    color:var(--fg); background:#0b111b; border:1px solid #27303f; border-radius:7px; padding:7px 14px; }
  button.theme[aria-current="true"] { border-color:var(--accent); color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset, 0 0 14px -4px var(--accent); }
  main { max-width:912px; margin:0 auto; padding:24px 16px 80px; }
  figure { margin:0 0 30px; }
  figcaption { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--dim);
    margin:0 0 8px; display:flex; gap:10px; align-items:center; }
  .num { color:var(--accent); opacity:.6; }
  img { width:100%; height:auto; display:block; border:1px solid #141b26; border-radius:10px; }
  footer { max-width:912px; margin:0 auto; padding:0 16px 60px; color:var(--dim); font-size:12px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header><div class="wrap">
  <h1><span class="cy">~/</span>contribution-styles <span style="color:var(--dim)">// live &amp; animated</span></h1>
  <p class="sub">The same year of contributions, seven ways. On the GitHub profile the image is static and
  rotates daily — here every style animates. Pick a palette:</p>
  <div class="themes"><button class="theme" data-theme="cyberpunk" aria-current="true">Cyberpunk</button><button class="theme" data-theme="matrix">Matrix</button><button class="theme" data-theme="f1">F1</button></div>
</div></header>
<main><figure>
  <figcaption><span class="num">00</span>Cycle — all styles</figcaption>
  <img data-style="cycle" src="styles/cyberpunk/cycle.svg" alt="Cycle — all styles contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">01</span>Reactor</figcaption>
  <img data-style="reactor" src="styles/cyberpunk/reactor.svg" alt="Reactor contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">02</span>Terrain</figcaption>
  <img data-style="terrain" src="styles/cyberpunk/terrain.svg" alt="Terrain contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">03</span>Rally</figcaption>
  <img data-style="rally" src="styles/cyberpunk/rally.svg" alt="Rally contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">04</span>Pulse (ECG)</figcaption>
  <img data-style="pulse" src="styles/cyberpunk/pulse.svg" alt="Pulse (ECG) contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">05</span>Circuit</figcaption>
  <img data-style="circuit" src="styles/cyberpunk/circuit.svg" alt="Circuit contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">06</span>Metropolis</figcaption>
  <img data-style="metropolis" src="styles/cyberpunk/metropolis.svg" alt="Metropolis contribution style" loading="lazy">
</figure><figure>
  <figcaption><span class="num">07</span>City</figcaption>
  <img data-style="classic" src="styles/cyberpunk/classic.svg" alt="City contribution style" loading="lazy">
</figure></main>
<footer>Generated from <a href="https://github.com/fxerkan/fxerkan">fxerkan/fxerkan</a> ·
  <a href="https://fxerkan.com">fxerkan.com</a></footer>
<script>
  const themes = ["cyberpunk", "matrix", "f1"];
  let cur = "cyberpunk";
  function setTheme(t) {
    cur = t;
    document.querySelectorAll('img[data-style]').forEach(img => {
      img.src = 'styles/' + t + '/' + img.dataset.style + '.svg';
    });
    document.querySelectorAll('button.theme').forEach(b =>
      b.setAttribute('aria-current', b.dataset.theme === t ? 'true' : 'false'));
  }
  document.querySelectorAll('button.theme').forEach(b =>
    b.addEventListener('click', () => setTheme(b.dataset.theme)));
</script>
</body>
</html>
